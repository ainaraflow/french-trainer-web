<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prueba de voz</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; color: #24213b; }
  button { display: block; width: 100%; margin: 10px 0; padding: 16px; font-size: 1.05rem; border: 0; border-radius: 14px; background: #ece9ff; color: #4b3fd8; font-weight: 700; }
  button:active { filter: brightness(.9); }
  #log { white-space: pre-wrap; font-family: Menlo, monospace; font-size: .75rem; background: #f6f6fb; border-radius: 10px; padding: 10px; min-height: 120px; }
</style>
</head>
<body>
  <h2>Prueba de voz</h2>
  <p>Toca los botones en orden y haz una captura del registro de abajo.</p>
  <button id="b1">1 · Pitido (audio normal)</button>
  <button id="b2">2 · Voz sin idioma: «Hello»</button>
  <button id="b3">3 · Voz francesa: «Bonjour»</button>
  <button id="b4">4 · Voz española: «Hola»</button>
  <button id="b5">5 · Reiniciar voz (cancel)</button>
  <div id="log"></div>
<script>
  const L = document.getElementById('log'), S = window.speechSynthesis;
  const st = () => S ? `speaking=${S.speaking} pending=${S.pending} paused=${S.paused}` : 'sin speechSynthesis';
  const log = m => { L.textContent += `${new Date().toLocaleTimeString()} ${m}\n`; };
  log(`${navigator.userAgent}`);
  log(`speechSynthesis: ${!!S} · voces: ${S ? S.getVoices().length : 0}`);
  if (S) S.onvoiceschanged = () => log(`voces cargadas: ${S.getVoices().length}`);
  function beep() {
    const sr = 22050, n = sr / 2, buf = new DataView(new ArrayBuffer(44 + n * 2));
    const w = (o, s) => [...s].forEach((c, i) => buf.setUint8(o + i, c.charCodeAt(0)));
    w(0, 'RIFF'); buf.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); buf.setUint32(16, 16, true); buf.setUint16(20, 1, true); buf.setUint16(22, 1, true);
    buf.setUint32(24, sr, true); buf.setUint32(28, sr * 2, true); buf.setUint16(32, 2, true); buf.setUint16(34, 16, true); w(36, 'data'); buf.setUint32(40, n * 2, true);
    for (let i = 0; i < n; i++) buf.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * 660) * 8000, true);
    const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' })));
    a.play().then(() => log('pitido: reproduciendo ✓')).catch(e => log('pitido: error ' + e.message));
  }
  let keep = [];
  function say(text, lang) {
    if (!S) return log('Este navegador no tiene speechSynthesis');
    const u = new SpeechSynthesisUtterance(text); if (lang) u.lang = lang; keep.push(u);
    u.onstart = () => log(`«${text}»: empieza ✓`); u.onend = () => log(`«${text}»: termina`);
    u.onerror = e => log(`«${text}»: error ${e.error}`);
    log(`speak «${text}» lang=${lang || '-'} (${st()})`);
    S.speak(u);
    setTimeout(() => log(`  1,5 s después: ${st()}`), 1500);
  }
  document.getElementById('b1').onclick = beep;
  document.getElementById('b2').onclick = () => say('Hello');
  document.getElementById('b3').onclick = () => say('Bonjour', 'fr-FR');
  document.getElementById('b4').onclick = () => say('Hola', 'es-ES');
  document.getElementById('b5').onclick = () => { S && S.cancel(); log(`cancel (${st()})`); };
</script>
</body>
</html>
