<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>French Trainer</title>
  <meta name="theme-color" content="#6d5dfc">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="French">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="shell">
    <header class="top">
      <div class="brand">
        <div class="logo">FR</div>
        <div>
          <div class="title">French Trainer</div>
          <div class="muted small">Español → Français · B1–C1</div>
        </div>
      </div>
      <div id="header-pill" class="pill"></div>
    </header>

    <nav class="tabs" id="tabs">
      <button data-tab="practice" class="active"><span class="ico">🃏</span><span>Practicar</span></button>
      <button data-tab="list"><span class="ico">📋</span><span>Lista</span></button>
      <button data-tab="oral"><span class="ico">🎤</span><span>Oral</span></button>
      <button data-tab="sounds"><span class="ico">🗣️</span><span>Sonidos</span></button>
      <button data-tab="grammar"><span class="ico">📖</span><span>Gramática</span></button>
      <button data-tab="friends"><span class="ico">👥</span><span>Amigos</span></button>
      <button data-tab="data"><span class="ico">💾</span><span>Datos</span></button>
    </nav>

    <main>
      <section id="view-practice" class="view active"></section>
      <section id="view-list" class="view"></section>
      <section id="view-oral" class="view"></section>
      <section id="view-sounds" class="view"></section>
      <section id="view-grammar" class="view"></section>
      <section id="view-suggest" class="view"></section>
      <section id="view-friends" class="view"></section>
      <section id="view-data" class="view"></section>
    </main>
  </div>
  <div id="toast" class="toast"></div>

  <script src="data.js"></script>
  <script src="grammar.js"></script>
  <script src="grammar_ex.js"></script>
  <script src="sounds.js"></script>
  <script src="app.js"></script>
</body>
</html>
